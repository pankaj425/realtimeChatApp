services:
  - type: web
    name: realtime-chat-backend
    runtime: node
    rootDir: 3.realtimeChatApp/backend
    plan: free
    buildCommand: npm install && npm --prefix ../frontend install && npm --prefix ../frontend run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: SERVER_URL
        sync: false
      - key: CLIENT_URL
        sync: false
      - key: CLOUD_NAME
        sync: false
      - key: API_KEY
        sync: false
      - key: API_SECRET
        sync: false
